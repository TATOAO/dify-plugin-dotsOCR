identity:
  author: "tatoao"
  name: "dots_ocr"
  label:
    en_US: "Dots.OCR"
    zh_Hans: "Dots.OCR"
  description:
    en_US: "Dots.OCR multi-modal document parsing provider"
    zh_Hans: "Dots.OCR 多模态文档解析提供商"
  icon: icon.svg

credentials_for_provider:
  endpoint:
    type: text-input
    label:
      en_US: "vLLM Endpoint"
      zh_Hans: "vLLM 服务端点"
    placeholder:
      en_US: "http://172.20.201.93:8001/v1"
      zh_Hans: "http://172.20.201.93:8001/v1"
    required: true
    help:
      en_US: "The base URL of the vLLM server (including /v1)"
      zh_Hans: "vLLM 服务器的基础 URL（包含 /v1）"
  model_name:
    type: text-input
    label:
      en_US: "Model Name"
      zh_Hans: "模型名称"
    default: "model"
    required: true
  api_key:
    type: secret-input
    label:
      en_US: "API Key"
      zh_Hans: "API 密钥"
    default: "0"
    required: false
  files_url:
    type: text-input
    label:
      en_US: "Dify Files URL"
      zh_Hans: "Dify 文件访问地址"
    placeholder:
      en_US: "http://localhost:5001 or https://dify.example.com"
      zh_Hans: "http://localhost:5001 或 https://dify.example.com"
    required: false
    help:
      en_US: "The base URL of your Dify instance for file access. Used to convert relative file paths to absolute URLs. If not set, the plugin will try to use the FILES_URL environment variable. Examples: http://localhost:5001, https://dify.example.com"
      zh_Hans: "Dify 实例的基础访问地址，用于将相对文件路径转换为完整URL。如果不设置，插件将尝试使用 FILES_URL 环境变量。示例：http://localhost:5001, https://dify.example.com"

tools:
  - tools/document_parsing.yaml
extra:
  python:
    source: provider/dots_ocr.py