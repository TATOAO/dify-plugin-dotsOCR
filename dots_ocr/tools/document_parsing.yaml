identity:
  name: "document_parsing"
  author: "tatoao"
  label:
    en_US: "Document Parsing"
    zh_Hans: "文档解析"
description:
  human:
    en_US: "Parse PDF, Word (.doc/.docx) or images into structured layout and text using Dots.OCR."
    zh_Hans: "使用 Dots.OCR 将 PDF、Word（.doc/.docx）或图像解析为结构化的布局和文本。"
  llm: "A tool to extract text and layout from PDF, Word (.doc/.docx) or images. Supports full layout analysis, layout only, and pure OCR modes. Word files require the Word-to-PDF service to be configured."
parameters:
  - name: file
    type: file
    label:
      en_US: "Document File"
      zh_Hans: "文档文件"
    required: true
    human_description:
      en_US: "The PDF, Word (.doc/.docx) or image file to parse."
      zh_Hans: "要解析的 PDF、Word（.doc/.docx）或图像文件。"
    form: form
  - name: mode
    type: select
    label:
      en_US: "Parsing Mode"
      zh_Hans: "解析模式"
    required: true
    default: "prompt_layout_all_en"
    options:
      - value: "prompt_layout_all_en"
        label:
          en_US: "Full Layout Analysis"
          zh_Hans: "完整布局分析"
      - value: "prompt_layout_only_en"
        label:
          en_US: "Layout Only"
          zh_Hans: "仅布局识别"
      - value: "prompt_ocr"
        label:
          en_US: "Pure OCR"
          zh_Hans: "纯 OCR 模式"
    human_description:
      en_US: "The parsing mode to use."
      zh_Hans: "使用的解析模式。"
    form: form
  - name: max_concurrency
    type: number
    label:
      en_US: "Max Concurrency"
      zh_Hans: "最大并发数"
    required: false
    default: 10
    human_description:
      en_US: "Maximum number of parallel pages for PDF processing."
      zh_Hans: "PDF 处理的最大并行页数。"
    form: form
output_schema:
  type: object
  properties:
    full_text:
      type: string
      label:
        en_US: "Full Text"
        zh_Hans: "全文文本"
      description: "Combined text content from all pages without layout information."
    pages:
      type: array
      label:
        en_US: "Pages"
        zh_Hans: "页列表"
      description: "Detailed JSON results for each page, including layout and text."
      items:
        type: object
    result:
      type: object
      label:
        en_US: "Result"
        zh_Hans: "完整结果"
      description: "The complete parsing result object."
extra:
  python:
    source: tools/document_parsing.py
