identity:
  name: "document_parsing"
  author: "tatoao"
  label:
    en_US: "Document Parsing"
    zh_Hans: "文档解析"
description:
  human:
    en_US: "Parse PDF and image documents using dots.ocr."
    zh_Hans: "使用 dots.ocr 解析 PDF 和图像文件。"
  llm: "Parse PDF and image documents to extract text and layout information using dots.ocr."
parameters:
  - name: file
    type: file
    required: true
    label:
      en_US: "File"
      zh_Hans: "文件"
    human_description:
      en_US: "PDF or image file to parse."
      zh_Hans: "需要解析的 PDF 或图像文件。"
  - name: prompt_mode
    type: select
    required: true
    default: "prompt_layout_all_en"
    options:
      - label:
          en_US: Full Layout Analysis
          zh_Hans: 完整布局分析
        value: prompt_layout_all_en
      - label:
          en_US: Layout Only
          zh_Hans: 仅布局识别
        value: prompt_layout_only_en
      - label:
          en_US: OCR Only
          zh_Hans: 纯 OCR
        value: prompt_ocr
    label:
      en_US: "Parsing Mode"
      zh_Hans: "解析模式"
  - name: max_concurrency
    type: number
    required: false
    default: 20
    label:
      en_US: "Max Concurrency"
      zh_Hans: "最大并发数"
    human_description:
      en_US: "Maximum concurrent pages to process for PDF files."
      zh_Hans: "处理 PDF 文件时的最大并行页数。"
extra:
  python:
    source: tools/document_parsing.py
